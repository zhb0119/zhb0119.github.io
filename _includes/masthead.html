<header class="masthead">
  <div class="masthead__inner-wrap">
    <a class="site-wordmark" href="{{ '/' | relative_url }}" aria-label="Haobo Zhang home">hz<span class="wordmark-dot">.</span></a>
    <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-controls="site-nav" aria-expanded="false">
      <span></span><span></span>
    </button>
    <nav id="site-nav" class="site-nav" aria-label="Main navigation">
      <ul class="site-nav__links">
        {% for link in site.data.navigation.main %}
          <li><a href="{{ link.url | relative_url }}" target="_self">{{ link.title }}</a></li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>
